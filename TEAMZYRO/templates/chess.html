<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shorekeeper Chess Arena</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Chess.js for client-side rule check & move suggestion -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        :root {
            --bg-color: #060913;
            --card-bg: rgba(13, 19, 33, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary-color: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.3);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-gold: #f59e0b;
            --danger-color: #f43f5e;
            --success-color: #10b981;
            
            /* Board colors */
            --sq-light: #dee3e6;
            --sq-dark: #8ca2ad;
            --sq-selected: rgba(245, 158, 11, 0.5);
            --sq-highlight: rgba(99, 102, 241, 0.4);
            --sq-check: rgba(244, 63, 94, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top, rgba(99, 102, 241, 0.12) 0%, transparent 60%);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1, h2, h3, h4 {
            font-family: 'Outfit', sans-serif;
        }

        /* Container Layout */
        .game-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 12px;
        }

        /* Player Panel Styling */
        .player-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(15px);
            transition: all 0.3s ease;
        }

        .player-card.active-turn {
            border-color: var(--primary-color);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-placeholder {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
            color: white;
            font-size: 1.1rem;
            text-transform: uppercase;
        }

        .player-details {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .player-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
            max-width: 150px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-secondary);
        }

        .status-dot.online {
            background: var(--success-color);
            box-shadow: 0 0 8px var(--success-color);
        }

        .player-timer {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 12px;
            border-radius: 10px;
            min-width: 80px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .player-card.active-turn .player-timer {
            color: var(--accent-gold);
            background: rgba(245, 158, 11, 0.1);
            border-color: rgba(245, 158, 11, 0.2);
        }

        /* Chessboard Styling */
        .board-container {
            width: 100%;
            aspect-ratio: 1;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            height: 100%;
        }

        .square {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .square.light {
            background-color: var(--sq-light);
        }

        .square.dark {
            background-color: var(--sq-dark);
        }

        .square.selected {
            background-color: var(--sq-selected) !important;
        }

        .square.highlighted-move {
            background-color: var(--sq-highlight) !important;
        }

        .square.check {
            background-color: var(--sq-check) !important;
            animation: pulse 1s infinite alternate;
        }

        /* Move dot suggestion */
        .move-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background-color: rgba(99, 102, 241, 0.6);
            pointer-events: none;
        }

        .move-capture {
            width: 80%;
            height: 80%;
            border-radius: 50%;
            border: 4px solid rgba(99, 102, 241, 0.6);
            pointer-events: none;
            position: absolute;
        }

        .chess-piece {
            width: 90%;
            height: 90%;
            object-fit: contain;
            z-index: 10;
            pointer-events: none;
            transition: transform 0.2s ease;
        }

        /* Status banner in middle */
        .status-banner {
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .status-banner span {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* Control Panel */
        .control-panel {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn:active {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn.danger {
            background: rgba(244, 63, 94, 0.1);
            border-color: rgba(244, 63, 94, 0.2);
            color: var(--danger-color);
        }

        .btn.danger:active {
            background: rgba(244, 63, 94, 0.2);
        }

        /* Overlay modal for game state */
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(6, 9, 19, 0.9);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .overlay-screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay-title {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a5b4fc, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .overlay-desc {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 24px;
            max-width: 280px;
        }

        /* Animation */
        @keyframes pulse {
            from { box-shadow: inset 0 0 10px rgba(244, 63, 94, 0.3); }
            to { box-shadow: inset 0 0 25px rgba(244, 63, 94, 0.7); }
        }
    </style>
</head>
<body>

    <div class="game-container">
        
        <!-- Opponent Card (Top) -->
        <div class="player-card" id="opponent-card">
            <div class="player-info">
                <div class="avatar-wrapper" style="width: 40px; height: 40px; position: relative; border-radius: 50%; overflow: hidden;">
                    <img id="opponent-avatar-img" src="" style="width: 100%; height: 100%; object-fit: cover; display: none;" onload="this.style.display='block'; document.getElementById('opponent-avatar-fallback').style.display='none';">
                    <div class="avatar-placeholder" id="opponent-avatar-fallback" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-weight: 700; background: linear-gradient(135deg, #4f46e5, #06b6d4); color: white;">?</div>
                </div>
                <div class="player-details">
                    <span class="player-name" id="opponent-name">Waiting...</span>
                    <div class="connection-status">
                        <div class="status-dot" id="opponent-status-dot"></div>
                        <span id="opponent-status-text">Disconnected</span>
                    </div>
                </div>
            </div>
            <div class="player-timer" id="opponent-timer">10:00</div>
        </div>

        <!-- Chess Board -->
        <div class="board-container">
            <div class="chessboard" id="board">
                <!-- Squares loaded dynamically -->
            </div>

            <!-- Overlay screen for connecting and game over -->
            <div class="overlay-screen active" id="overlay">
                <h2 class="overlay-title" id="overlay-title">Connecting...</h2>
                <p class="overlay-desc" id="overlay-desc">Establishing connection to the game server. Please wait.</p>
                <button class="btn" id="overlay-btn" style="display: none; min-width: 150px;" onclick="closeOverlay()">Close</button>
            </div>
        </div>

        <!-- Match Info Banner -->
        <div class="status-banner" id="status-banner">
            Match bet pool: <span id="pool-value">💰 0</span> coins
        </div>

        <!-- Player Card (Bottom) -->
        <div class="player-card" id="player-card">
            <div class="player-info">
                <div class="avatar-wrapper" style="width: 40px; height: 40px; position: relative; border-radius: 50%; overflow: hidden;">
                    <img id="player-avatar-img" src="" style="width: 100%; height: 100%; object-fit: cover; display: none;" onload="this.style.display='block'; document.getElementById('player-avatar-fallback').style.display='none';">
                    <div class="avatar-placeholder" id="player-avatar-fallback" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-weight: 700; background: linear-gradient(135deg, #4f46e5, #06b6d4); color: white;">U</div>
                </div>
                <div class="player-details">
                    <span class="player-name" id="player-name">Player</span>
                    <div class="connection-status">
                        <div class="status-dot online"></div>
                        <span>You (Online)</span>
                    </div>
                </div>
            </div>
            <div class="player-timer" id="player-timer">10:00</div>
        </div>

        <!-- Control Buttons -->
        <div class="control-panel">
            <button class="btn danger" id="resign-btn" onclick="requestResign()">🏳️ Resign</button>
            <button class="btn" id="abort-btn" onclick="requestAbort()">❌ Abort</button>
        </div>

    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            tg.ready();
        }

        const roomId = window.location.pathname.split('/').pop();
        const initData = tg?.initData || "";
        
        // Development fallback user ID if opened outside Telegram
        let devUserId = null;
        if (!initData) {
            const urlParams = new URLSearchParams(window.location.search);
            devUserId = urlParams.get('user_id');
            if (!devUserId) {
                // Generate a random ID for debug
                devUserId = localStorage.getItem('chess_dev_user_id');
                if (!devUserId) {
                    devUserId = String(Math.floor(100000 + Math.random() * 900000));
                    localStorage.setItem('chess_dev_user_id', devUserId);
                }
            }
        }

        // Initialize Chess.js engine
        let game = new Chess();
        
        let ws;
        let myRole = 'white'; // white or black
        let myTurn = false;
        let selectedSquare = null;
        let lastMove = null;
        let roomStatus = 'waiting';
        let whitePlayerName = "White";
        let blackPlayerName = "Black";
        let betAmount = 0;

        // Synthesis for move tick
        function playMoveSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(140, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } catch (e) {
                console.error("Audio synthesiser blocked:", e);
            }
        }

        // Initialize Web Socket Connection
        function connectWS() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/chess/ws/${roomId}`;
            
            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                const authMsg = {
                    type: "auth",
                    initData: initData,
                    user_id: devUserId
                };
                ws.send(JSON.stringify(authMsg));
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleWSMessage(data);
            };

            ws.onclose = () => {
                setOverlay("Connection Lost", "The connection to the match server was lost. Reconnecting in 3 seconds...");
                setTimeout(connectWS, 3000);
            };

            ws.onerror = (err) => {
                console.error("WebSocket error:", err);
            };
        }

        function handleWSMessage(data) {
            switch(data.type) {
                case "init":
                    myRole = data.role;
                    game = new Chess(data.board_state);
                    roomStatus = data.status;
                    whitePlayerName = data.white_name;
                    blackPlayerName = data.black_name;
                    betAmount = data.bet;
                    
                    // Parse username initials
                    document.getElementById('player-name').innerText = myRole === 'white' ? data.white_name : data.black_name;
                    document.getElementById('opponent-name').innerText = myRole === 'white' ? data.black_name : data.white_name;
                    document.getElementById('player-avatar-fallback').innerText = (myRole === 'white' ? data.white_name : data.black_name).substring(0,2);
                    document.getElementById('opponent-avatar-fallback').innerText = (myRole === 'white' ? data.black_name : data.white_name).substring(0,2);
                    
                    // Fetch dynamic avatars
                    const myId = myRole === 'white' ? data.white_id : data.black_id;
                    const opponentId = myRole === 'white' ? data.black_id : data.white_id;
                    document.getElementById('player-avatar-img').src = `/avatar/${myId}`;
                    document.getElementById('opponent-avatar-img').src = `/avatar/${opponentId}`;
                    
                    document.getElementById('pool-value').innerText = `💰 ${(data.bet * 2).toLocaleString()}`;
                    
                    updateConnectionDot(data.opponent_connected);
                    updateTimers(data.white_time, data.black_time);
                    
                    document.getElementById('overlay').classList.remove('active');
                    
                    // Re-apply history to get last move
                    if (data.move_history.length > 0) {
                        lastMove = data.move_history[data.move_history.length - 1];
                    }
                    
                    // Hide abort button if moves have been made
                    if (data.move_history.length > 0) {
                        document.getElementById('abort-btn').style.display = 'none';
                    }
                    
                    renderBoard();
                    checkTurnState(data.active_turn);
                    break;
                    
                case "update":
                    game = new Chess(data.board_state);
                    roomStatus = data.status;
                    
                    if (data.move_history.length > 0) {
                        lastMove = data.move_history[data.move_history.length - 1];
                        playMoveSound();
                    }
                    
                    if (data.move_history.length > 0) {
                        document.getElementById('abort-btn').style.display = 'none';
                    }
                    
                    updateTimers(data.white_time, data.black_time);
                    renderBoard();
                    checkTurnState(data.active_turn);
                    break;
                    
                case "opponent_status":
                    updateConnectionDot(data.connected);
                    break;
                    
                case "timer_sync":
                    updateTimers(data.white_time, data.black_time);
                    break;
                    
                case "game_over":
                    roomStatus = data.status;
                    handleGameOver(data);
                    break;
                    
                case "illegal_move":
                    // Reset client state
                    game = new Chess(); // Will be synced on next packet
                    alert("Move rejected by server: " + data.message);
                    break;
                    
                case "error":
                    alert("Server error: " + data.message);
                    break;
            }
        }

        function updateConnectionDot(connected) {
            const dot = document.getElementById('opponent-status-dot');
            const text = document.getElementById('opponent-status-text');
            if (connected) {
                dot.className = "status-dot online";
                text.innerText = "Online";
            } else {
                dot.className = "status-dot";
                text.innerText = "Disconnected";
            }
        }

        function checkTurnState(activeTurn) {
            myTurn = (activeTurn === myRole) && (roomStatus === 'active');
            
            // UI Visual highlights
            document.getElementById('player-card').className = `player-card ${myTurn ? 'active-turn' : ''}`;
            document.getElementById('opponent-card').className = `player-card ${(!myTurn && roomStatus === 'active') ? 'active-turn' : ''}`;
            
            const banner = document.getElementById('status-banner');
            if (roomStatus !== 'active') {
                return; // Game over or not started handles it
            }
            if (myTurn) {
                banner.innerHTML = "🎯 <span>Your Turn</span> - Make your move!";
            } else {
                banner.innerHTML = "⏳ Waiting for opponent...";
            }
        }

        function updateTimers(whiteTime, blackTime) {
            const myTime = myRole === 'white' ? whiteTime : blackTime;
            const oppTime = myRole === 'white' ? blackTime : whiteTime;
            
            document.getElementById('player-timer').innerText = formatTime(myTime);
            document.getElementById('opponent-timer').innerText = formatTime(oppTime);
        }

        function formatTime(secs) {
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        // Render Chessboard UI
        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            
            // Flipped board layout depending on role
            const ranks = myRole === 'black' ? [1, 2, 3, 4, 5, 6, 7, 8] : [8, 7, 6, 5, 4, 3, 2, 1];
            const files = myRole === 'black' ? ['h', 'g', 'f', 'e', 'd', 'c', 'b', 'a'] : ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
            
            // Check flags
            const inCheck = game.in_check();
            let checkSquare = null;
            if (inCheck) {
                // Find current checking king
                const turn = game.turn();
                // Find square
                for (let r = 1; r <= 8; r++) {
                    for (let f = 0; f < 8; f++) {
                        const sq = `${['a','b','c','d','e','f','g','h'][f]}${r}`;
                        const piece = game.get(sq);
                        if (piece && piece.type === 'k' && piece.color === turn) {
                            checkSquare = sq;
                            break;
                        }
                    }
                }
            }

            // Highlighting moves for selected square
            const suggestedMoves = selectedSquare ? game.moves({ square: selectedSquare, verbose: true }) : [];
            const suggestedSquares = new Set(suggestedMoves.map(m => m.to));

            // Determine last move square highlight
            let lmFrom = null, lmTo = null;
            if (lastMove) {
                lmFrom = lastMove.substring(0, 2);
                lmTo = lastMove.substring(2, 4);
            }

            for (let rIndex = 0; rIndex < 8; rIndex++) {
                for (let fIndex = 0; fIndex < 8; fIndex++) {
                    const rank = ranks[rIndex];
                    const file = files[fIndex];
                    const squareId = `${file}${rank}`;
                    
                    const squareEl = document.createElement('div');
                    
                    // Determine light/dark color
                    const col = file.charCodeAt(0) - 97; // a=0, b=1...
                    const row = rank - 1;
                    const isLight = (col + row) % 2 !== 0;
                    
                    squareEl.className = `square ${isLight ? 'light' : 'dark'}`;
                    squareEl.dataset.square = squareId;
                    
                    // Visual Highlights
                    if (selectedSquare === squareId) {
                        squareEl.classList.add('selected');
                    }
                    if (squareId === lmFrom || squareId === lmTo) {
                        squareEl.classList.add('highlighted-move');
                    }
                    if (squareId === checkSquare) {
                        squareEl.classList.add('check');
                    }

                    // Render Piece
                    const piece = game.get(squareId);
                    if (piece) {
                        const pieceImg = document.createElement('img');
                        pieceImg.src = `https://chessboardjs.com/img/chesspieces/wikipedia/${piece.color}${piece.type.toUpperCase()}.png`;
                        pieceImg.className = 'chess-piece';
                        squareEl.appendChild(pieceImg);
                    }

                    // Render Move Suggestions
                    if (suggestedSquares.has(squareId)) {
                        const marker = document.createElement('div');
                        if (piece) {
                            marker.className = 'move-capture';
                        } else {
                            marker.className = 'move-dot';
                        }
                        squareEl.appendChild(marker);
                    }

                    // Event listener
                    squareEl.onclick = () => handleSquareClick(squareId);
                    boardEl.appendChild(squareEl);
                }
            }
        }

        function handleSquareClick(squareId) {
            if (!myTurn || roomStatus !== 'active') return;
            
            const piece = game.get(squareId);
            
            if (selectedSquare === squareId) {
                // Deselect
                selectedSquare = null;
                renderBoard();
                return;
            }

            if (selectedSquare) {
                // Check if target is a valid move
                const moves = game.moves({ square: selectedSquare, verbose: true });
                const validMove = moves.find(m => m.to === squareId);
                
                if (validMove) {
                    // Send move to server
                    let uci = selectedSquare + squareId;
                    
                    // Check auto-promotion to Queen
                    const activePiece = game.get(selectedSquare);
                    if (activePiece.type === 'p' && (squareId.endsWith('8') || squareId.endsWith('1'))) {
                        uci += 'q'; // Queen promotion suffix
                    }
                    
                    sendMove(uci);
                    
                    // Optimistic update
                    game.move(validMove);
                    lastMove = uci;
                    playMoveSound();
                    selectedSquare = null;
                    renderBoard();
                    return;
                }
            }

            // Select piece of player color
            if (piece && piece.color === myRole[0]) {
                selectedSquare = squareId;
                renderBoard();
            } else {
                selectedSquare = null;
                renderBoard();
            }
        }

        function sendMove(uci) {
            ws.send(JSON.stringify({
                type: "move",
                move: uci
            }));
        }

        function requestResign() {
            if (roomStatus !== 'active') return;
            if (confirm("Are you sure you want to resign this match? You will lose your bet!")) {
                ws.send(JSON.stringify({ type: "resign" }));
            }
        }

        function requestAbort() {
            if (roomStatus !== 'active') return;
            if (confirm("Are you sure you want to abort the match? Both players will be fully refunded.")) {
                ws.send(JSON.stringify({ type: "abort" }));
            }
        }

        function handleGameOver(data) {
            const titleEl = document.getElementById('overlay-title');
            const descEl = document.getElementById('overlay-desc');
            const btnEl = document.getElementById('overlay-btn');
            
            let title = "Game Over";
            let desc = "";
            const totalPool = betAmount * 2;
            
            if (data.status === "white_won") {
                title = myRole === 'white' ? "🏆 Victory!" : "😭 Defeat";
                if (myRole === 'white') {
                    desc = `Congratulations! You won 💰 ${totalPool.toLocaleString()} coins! (Defeated ${blackPlayerName} by ${data.reason})`;
                } else {
                    desc = `You lost the match. ${whitePlayerName} won 💰 ${totalPool.toLocaleString()} coins by ${data.reason}.`;
                }
            } else if (data.status === "black_won") {
                title = myRole === 'black' ? "🏆 Victory!" : "😭 Defeat";
                if (myRole === 'black') {
                    desc = `Congratulations! You won 💰 ${totalPool.toLocaleString()} coins! (Defeated ${whitePlayerName} by ${data.reason})`;
                } else {
                    desc = `You lost the match. ${blackPlayerName} won 💰 ${totalPool.toLocaleString()} coins by ${data.reason}.`;
                }
            } else if (data.status === "draw") {
                title = "🤝 Drawn Match";
                desc = `The game ended in a draw by ${data.reason}. Your bet of 💰 ${betAmount.toLocaleString()} coins has been refunded.`;
            } else if (data.status === "aborted") {
                title = "❌ Match Aborted";
                desc = `The game was aborted before play started. Your bet of 💰 ${betAmount.toLocaleString()} coins has been refunded.`;
            }
            
            titleEl.innerText = title;
            descEl.innerText = desc;
            btnEl.style.display = "block";
            
            document.getElementById('overlay').classList.add('active');
        }

        function setOverlay(title, desc) {
            document.getElementById('overlay-title').innerText = title;
            document.getElementById('overlay-desc').innerText = desc;
            document.getElementById('overlay-btn').style.display = "none";
            document.getElementById('overlay').classList.add('active');
        }

        function closeOverlay() {
            document.getElementById('overlay').classList.remove('active');
        }

        // Start connection
        connectWS();
    </script>
</body>
</html>
