<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Evo Creator · Art Shop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#0d0b16;--panel:#171426;--line:#302a47;--text:#f7f3ff;--muted:#b9b0d0;--accent:#b69cff;--gold:#ffd782}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#251a42,var(--bg) 55%);color:var(--text);font:15px system-ui,sans-serif}header{padding:22px 16px 14px;position:sticky;top:0;background:#0d0b16ef;z-index:2;border-bottom:1px solid var(--line)}h1{font-size:25px;margin:0 0 5px}p{color:var(--muted);line-height:1.45}.wrap{max-width:900px;margin:auto;padding:16px}.tabs{display:flex;gap:8px;margin-top:15px}.tabs button,button{border:0;border-radius:12px;padding:12px 14px;background:var(--accent);color:#211634;font-weight:750;cursor:pointer}.tabs button{flex:1;background:#29233b;color:var(--text)}.tabs button.active{background:var(--accent);color:#211634}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:13px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}.card img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#211b32}.card .body{padding:12px}.card h3{font-size:16px;margin:0 0 5px;overflow-wrap:anywhere}.muted{color:var(--muted);font-size:12px}.price{color:var(--gold);font-weight:800;margin:9px 0}.card button{width:100%;padding:10px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}label{display:block;margin:12px 0 6px;color:var(--muted)}input,textarea{width:100%;background:#0f0d1a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit}textarea{min-height:90px;resize:vertical}.preview{width:100%;max-height:300px;object-fit:contain;border-radius:12px;margin-top:10px}.hidden{display:none!important}.status{padding:12px;border-radius:10px;background:#252039;margin:12px 0;overflow-wrap:anywhere}.empty{text-align:center;padding:40px 15px}.full{width:100%;margin-top:12px}.tag{display:inline-block;background:#33274d;border-radius:20px;padding:4px 8px;font-size:11px;color:#dfd1ff}
</style></head><body>
<header><h1 id="heading">🛍️ Art Shop</h1><p id="subhead">Discover community-created custom characters.</p><div class="tabs"><button id="shopTab" class="active" onclick="showMode('shop')">Art Shop</button><button id="createTab" onclick="showMode('create')">Creator Studio</button></div></header>
<main class="wrap"><section id="shopView"><div id="artGrid" class="grid"></div><div id="empty" class="empty hidden"><h3>No approved art yet</h3><p>Approved custom characters will appear here.</p></div></section>
<section id="createView" class="hidden"><div class="panel"><h2>🎨 Submit your character</h2><p>Submission costs 5,000 Evo Points. Points are held during review and refunded if rejected.</p>
<form id="artForm"><label>Character image (PNG, JPEG, WebP · max 5 MB)</label><input id="image" type="file" accept="image/png,image/jpeg,image/webp" required><img id="preview" class="preview hidden">
<label>Character name</label><input id="name" maxlength="60" required placeholder="e.g. Naruto Uzumaki"><label>Anime name</label><input id="anime" maxlength="100" required placeholder="e.g. Naruto Shippuden"><label>Description (optional)</label><textarea id="description" maxlength="500"></textarea>
<label>Sale price (10,000–1,000,000 Coins)</label><input id="price" type="number" min="10000" max="1000000" step="1" value="10000" required><label>Rarity (locked)</label><input value="customise" readonly>
<button class="full" type="submit">Submit for admin approval · 5,000 Evo</button></form><div id="submitStatus" class="status hidden"></div></div></section><div id="globalStatus" class="status hidden"></div></main>
<script>
const tg=window.Telegram&&window.Telegram.WebApp;if(tg){tg.ready();tg.expand()}const initData=tg?tg.initData:'';
let mode=location.pathname==='/customise'?'create':'shop';
function showMode(next){mode=next;document.getElementById('shopView').classList.toggle('hidden',mode!=='shop');document.getElementById('createView').classList.toggle('hidden',mode!=='create');document.getElementById('shopTab').classList.toggle('active',mode==='shop');document.getElementById('createTab').classList.toggle('active',mode==='create');document.getElementById('heading').textContent=mode==='shop'?'🛍️ Art Shop':'🎨 Creator Studio';document.getElementById('subhead').textContent=mode==='shop'?'Only community-created custom characters.':'Upload your character and submit it for approval.';if(mode==='shop')loadArt()}
function message(text,error){const el=document.getElementById('globalStatus');el.textContent=text;el.classList.remove('hidden');el.style.borderColor=error?'#b94d6a':'#4d956c'}
async function api(path,data){const res=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({},data,{initData:initData}))});const result=await res.json().catch(()=>({error:'Unexpected server response'}));if(!res.ok)throw new Error(result.error||'Request failed');return result}
async function loadArt(){const grid=document.getElementById('artGrid'),empty=document.getElementById('empty');grid.innerHTML='<p>Loading art…</p>';try{const r=await fetch('/api/art/list');const data=await r.json();grid.innerHTML='';empty.classList.toggle('hidden',data.items.length>0);data.items.forEach(art=>{const card=document.createElement('article');card.className='card';const img=document.createElement('img');img.src=art.image_url;img.alt=art.name;const body=document.createElement('div');body.className='body';const title=document.createElement('h3');title.textContent=art.name;const anime=document.createElement('div');anime.className='muted';anime.textContent='Anime: '+(art.anime||'Unknown Anime');const charId=document.createElement('div');charId.className='muted';charId.textContent='Character ID: '+(art.character_id||'—');const creator=document.createElement('div');creator.className='muted';creator.textContent='By '+art.creator_name;const tag=document.createElement('span');tag.className='tag';tag.textContent='customise';const price=document.createElement('div');price.className='price';price.textContent=Number(art.price).toLocaleString()+' Coins';const buy=document.createElement('button');buy.textContent='Buy art';buy.onclick=async()=>{if(!initData){message('Open Art Shop from the Telegram bot to purchase.',true);return}if(!confirm('Buy '+art.name+' for '+Number(art.price).toLocaleString()+' Coins?'))return;buy.disabled=true;try{const result=await api('/api/art/buy',{art_id:art.id});message(result.message,false);if(tg)tg.HapticFeedback.notificationOccurred('success')}catch(e){message(e.message,true)}finally{buy.disabled=false}};body.append(title,anime,charId,creator,tag,price,buy);card.append(img,body);grid.append(card)})}catch(e){grid.innerHTML='';message('Could not load Art Shop: '+e.message,true)}}
document.getElementById('image').addEventListener('change',e=>{const f=e.target.files[0],img=document.getElementById('preview');if(!f)return;if(f.size>5*1024*1024){message('Image must be under 5 MB.',true);e.target.value='';return}img.src=URL.createObjectURL(f);img.classList.remove('hidden')});
document.getElementById('artForm').addEventListener('submit',async e=>{e.preventDefault();if(!initData){message('Open Creator Studio from /customise in a Telegram private chat.',true);return}const file=document.getElementById('image').files[0];if(!file)return;const button=e.target.querySelector('button[type=submit]');button.disabled=true;try{const image=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)});const result=await api('/api/customise/submit',{name:document.getElementById('name').value,anime:document.getElementById('anime').value,description:document.getElementById('description').value,price:document.getElementById('price').value,image:image});const status=document.getElementById('submitStatus');status.textContent=result.message;status.classList.remove('hidden');e.target.reset();document.getElementById('preview').classList.add('hidden');if(tg)tg.HapticFeedback.notificationOccurred('success')}catch(err){message(err.message,true)}finally{button.disabled=false}});
showMode(mode);
</script></body></html>
